---
# ansible/deploy.yml — AVOC-Deployment auf die lokale Test-VM (LOCALVM-07).
#
# Voraussetzung: ansible/site.yml wurde bereits erfolgreich gegen den Host gefahren (Docker,
# avoc-User, Firewall, .env + SSL-Zertifikat vorhanden — s. roles/bootstrap, roles/firewall,
# roles/secrets).
#
# GHCRPULL-04 (tasks/backlog.md EPIC "GHCR-Pull-Deployment", Sprint 57): Default ist jetzt
# GHCR-Pull — deploy-hetzner.sh loggt sich mit den echten (per Umgebungsvariable injizierten,
# s. ansible/roles/secrets/defaults/main.yml) GHCR-Zugangsdaten ein und zieht die avoc-*-Images
# direkt von ghcr.io. Dieses Playbook selbst baut nichts, es überträgt nur Configs + startet
# den Stack; der eigentliche Pull passiert in deploy-hetzner.sh.
#
# Fallback (avoc_skip_registry_pull: true, Default false — s. group_vars/local_vm.yml): der
# alte Weg aus Sprint 48 (LOCALVM-07) bleibt erhalten — docker save (lokal) -> copy -> docker
# load (VM), kein Registry-Roundtrip. Voraussetzung dafür: die avoc-*-Images sind auf dem
# Dev-Rechner bereits lokal gebaut UND mit demselben ${REGISTRY}-Präfix getaggt, den die VM in
# ihrer .env hat (z. B. 'make build-prod REGISTRY=ghcr.io/floristein' oder Retag von Hand — s.
# docker-compose.hetzner.yml-Kopfkommentar). Dasselbe etablierte Transfer-Muster wie
# scripts/deploy.sh (EC2, "Übergabe-Abweichung von ADR-019", s. docker-compose.prod.yml-
# Kommentar am Dateianfang). scripts/deploy-hetzner.sh selbst bleibt bis auf den klar
# markierten SKIP_REGISTRY_PULL-Zweig 1:1 aus docs/deployment/hetzner-setup.md Schritt 7
# übernommen — s. Kommentar dort.
#
# Seit Sprint 56 (EPIC "CI-Image-Publishing nach GHCR", CIPUB-01) baut/pusht
# .github/workflows/docker-build.yml die avoc-*-Images bei jedem Push auf main (und seit
# Sprint 57 bei jedem v*-Tag-Push zusätzlich versioniert) nach ghcr.io — das ist die Quelle,
# von der dieses Playbook im Default-Fall pullt.
#
# Aufruf (GHCR-Pull, Default): GHCR_USERNAME=<user> GHCR_TOKEN=<PAT> ansible-playbook deploy.yml
# Aufruf (Fallback): ansible-playbook deploy.yml -e avoc_skip_registry_pull=true
# (jeweils aus dem Verzeichnis ansible/)
# Syntax-Check ohne Zielmaschine: ansible-playbook deploy.yml --syntax-check

- name: AVOC lokale VM — Deployment (Configs + Images + Stack-Start)
  hosts: local_vm
  become: true
  gather_facts: true
  vars:
    repo_root: "{{ playbook_dir }}/.."
    deploy_version: "{{ lookup('env', 'VERSION') | default('latest', true) }}"

  tasks:
    # ─── Compose-Datei + Deploy-Script ─────────────────────────────────────
    - name: docker-compose.hetzner.yml übertragen
      ansible.builtin.copy:
        src: "{{ repo_root }}/infrastructure/compose/docker-compose.hetzner.yml"
        dest: "{{ app_dir }}/docker-compose.hetzner.yml"
        owner: "{{ avoc_user }}"
        group: "{{ avoc_user }}"
        mode: "0644"

    - name: deploy-hetzner.sh übertragen
      ansible.builtin.copy:
        src: "{{ repo_root }}/scripts/deploy-hetzner.sh"
        dest: "{{ app_dir }}/deploy-hetzner.sh"
        owner: "{{ avoc_user }}"
        group: "{{ avoc_user }}"
        mode: "0755"

    # ─── Config-Dateien: Mosquitto/MediaMTX/Loki/Promtail/Grafana ──────────
    # Hinweis: hetzner-setup.md Schritt 6 listet für Mosquitto nur mosquitto.conf (Doku-Stand vor
    # MQTTS-01/TLS). Diese Ergänzung (passwd + TLS-Zertifikate) schließt die Lücke zum
    # tatsächlichen Compose-Stand, ohne die Doku in diesem Sprint (Teil A) anzufassen — s.
    # Sprint-Ergebnisse und LOCALVM-09 (Doku-Update, Sprint B).
    #
    # HINWEIS (Sprint 49, LOCALVM-08b/c, Erkenntnis aus dem ersten echten deploy.yml-Lauf):
    # passwd/key.pem ursprünglich mit mode 0600 (owner avoc) übertragen — der eclipse-mosquitto:2
    # Container-Prozess konnte die Datei dann nicht öffnen ("Unable to open pwfile", Container in
    # Crash-Loop, Folgefehler in allen MQTT-Clients: telemetry-service/fleet-service/
    # vehicle-mock kamen nie über den Broker hinaus verbunden). Ursache: der Bind-Mount macht die
    # Host-UID (avoc) maßgeblich, der Container-Prozess läuft aber nicht unter genau dieser UID —
    # 0600 sperrt ihn aus. Fix: 0644 (weiterhin nicht world-writable; für reine Test-Dummy-Werte
    # auf einer rein lokalen, nicht exponierten VM ausreichend, s. roles/secrets/defaults
    # Kopfkommentar zum selben Trade-off).
    - name: Mosquitto-Config + TLS-Assets übertragen
      ansible.builtin.copy:
        src: "{{ repo_root }}/infrastructure/mosquitto/{{ item.src }}"
        dest: "{{ app_dir }}/mosquitto/{{ item.dest }}"
        owner: "{{ avoc_user }}"
        group: "{{ avoc_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: "mosquitto.conf", dest: "mosquitto.conf", mode: "0644" }
        - { src: "passwd", dest: "passwd", mode: "0644" }
        - { src: "certs/ca.pem", dest: "ca.pem", mode: "0644" }
        - { src: "certs/cert.pem", dest: "cert.pem", mode: "0644" }
        - { src: "certs/key.pem", dest: "key.pem", mode: "0644" }
      loop_control:
        label: "{{ item.src }}"

    - name: MediaMTX-Config übertragen
      ansible.builtin.copy:
        src: "{{ repo_root }}/infrastructure/mediamtx/mediamtx.yml"
        dest: "{{ app_dir }}/mediamtx/mediamtx.yml"
        owner: "{{ avoc_user }}"
        group: "{{ avoc_user }}"
        mode: "0644"

    - name: Loki-Config übertragen
      ansible.builtin.copy:
        src: "{{ repo_root }}/infrastructure/loki/loki.yml"
        dest: "{{ app_base_dir }}/loki/loki.yml"
        owner: "{{ avoc_user }}"
        group: "{{ avoc_user }}"
        mode: "0644"

    - name: Promtail-Config übertragen
      ansible.builtin.copy:
        src: "{{ repo_root }}/infrastructure/promtail/promtail.yml"
        dest: "{{ app_base_dir }}/promtail/promtail.yml"
        owner: "{{ avoc_user }}"
        group: "{{ avoc_user }}"
        mode: "0644"

    - name: Grafana-Datasource-Provisioning übertragen
      ansible.builtin.copy:
        src: "{{ repo_root }}/infrastructure/grafana/provisioning/datasources/loki.yml"
        dest: "{{ app_base_dir }}/grafana/provisioning/datasources/loki.yml"
        owner: "{{ avoc_user }}"
        group: "{{ avoc_user }}"
        mode: "0644"

    - name: Grafana-Dashboard-Provisioning übertragen
      ansible.builtin.copy:
        src: "{{ repo_root }}/infrastructure/grafana/provisioning/dashboards/{{ item }}"
        dest: "{{ app_base_dir }}/grafana/provisioning/dashboards/{{ item }}"
        owner: "{{ avoc_user }}"
        group: "{{ avoc_user }}"
        mode: "0644"
      loop:
        - dashboards.yml
        - avoc.json

    # ─── Fallback (avoc_skip_registry_pull: true): Images lokal gebaut, ohne Registry-Roundtrip
    # übertragen. Im Default-Fall (false) übersprungen — deploy-hetzner.sh pullt dann direkt von
    # GHCR, dieser ganze Block ist nur für den Sprint-48-Fallback nötig.
    - name: Benötigte Images aus docker-compose.hetzner.yml ermitteln (lokal)
      ansible.builtin.command:
        cmd: docker compose -f {{ repo_root }}/infrastructure/compose/docker-compose.hetzner.yml config --images
      delegate_to: localhost
      become: false
      register: avoc_required_images
      changed_when: false
      when: avoc_skip_registry_pull | bool
      environment:
        VERSION: "{{ deploy_version }}"
        # Muss zum REGISTRY-Wert in der echten .env passen (roles/secrets), sonst findet der
        # Fallback-Pfad die per docker save/load erwarteten Image-Tags nicht — s.
        # GHCR_REGISTRY-Override in ansible/roles/secrets/defaults/main.yml.
        REGISTRY: "{{ lookup('env', 'GHCR_REGISTRY') | default('ghcr.io/floristein', true) }}"
        DB_PASSWORD: "unused-for-image-listing"
        JWT_SECRET: "unused-for-image-listing"
        WHIP_STREAM_KEY: "unused-for-image-listing"
        TURN_EXTERNAL_IP: "unused-for-image-listing"
        TURN_REALM: "unused-for-image-listing"
        TURN_USER: "unused-for-image-listing"
        TURN_PASSWORD: "unused-for-image-listing"
        GRAFANA_ADMIN_USER: "unused-for-image-listing"
        GRAFANA_ADMIN_PASSWORD: "unused-for-image-listing"
        MQTT_USERNAME: "unused-for-image-listing"
        MQTT_PASSWORD: "unused-for-image-listing"

    - name: avoc-*-Images herausfiltern (nur selbst gebaute, keine Basisimages wie postgres/coturn/grafana)
      ansible.builtin.set_fact:
        avoc_local_images: "{{ avoc_required_images.stdout_lines | select('search', 'avoc-') | list }}"
      when: avoc_skip_registry_pull | bool

    - name: Prüfen, welche Images lokal tatsächlich vorhanden sind
      ansible.builtin.command:
        cmd: "docker image inspect {{ item }}"
      delegate_to: localhost
      become: false
      loop: "{{ avoc_local_images }}"
      register: avoc_image_check
      changed_when: false
      failed_when: false
      when: avoc_skip_registry_pull | bool

    - name: Warnen, falls Images lokal fehlen (vor erneutem Lauf lokal bauen, s. Playbook-Kopfkommentar)
      ansible.builtin.debug:
        msg: "WARNUNG: Image fehlt lokal: {{ item.item }} — vor erneutem Playbook-Lauf lokal bauen."
      loop: "{{ avoc_image_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: avoc_skip_registry_pull | bool and item.rc != 0

    - name: Images lokal als Tar-Archiv sichern (docker save)
      ansible.builtin.command:
        cmd: "docker save -o {{ repo_root }}/.avoc-images-transfer.tar {{ avoc_local_images | join(' ') }}"
      delegate_to: localhost
      become: false
      when: avoc_skip_registry_pull | bool and avoc_local_images | length > 0
      changed_when: true

    - name: Image-Tar auf die VM übertragen
      ansible.builtin.copy:
        src: "{{ repo_root }}/.avoc-images-transfer.tar"
        dest: "/tmp/avoc-images-transfer.tar"
        mode: "0644"
      when: avoc_skip_registry_pull | bool and avoc_local_images | length > 0

    - name: Images auf der VM per docker load einspielen
      ansible.builtin.command:
        cmd: "docker load -i /tmp/avoc-images-transfer.tar"
      when: avoc_skip_registry_pull | bool and avoc_local_images | length > 0
      changed_when: true

    - name: Temporäre Image-Datei auf der VM aufräumen
      ansible.builtin.file:
        path: /tmp/avoc-images-transfer.tar
        state: absent
      when: avoc_skip_registry_pull | bool and avoc_local_images | length > 0

    - name: Temporäre Image-Datei lokal aufräumen
      ansible.builtin.file:
        path: "{{ repo_root }}/.avoc-images-transfer.tar"
        state: absent
      delegate_to: localhost
      become: false
      when: avoc_skip_registry_pull | bool and avoc_local_images | length > 0

    # ─── deploy-hetzner.sh ausführen ────────────────────────────────────────
    # SKIP_REGISTRY_PULL wird 1:1 aus avoc_skip_registry_pull durchgereicht (Default false =
    # GHCR-Login+Pull; true = Fallback, Bilder liegen bereits lokal geladen vor, s. oben).
    - name: deploy-hetzner.sh auf der VM ausführen
      ansible.builtin.command:
        cmd: "bash {{ app_dir }}/deploy-hetzner.sh"
      become_user: "{{ avoc_user }}"
      environment:
        VERSION: "{{ deploy_version }}"
        SKIP_REGISTRY_PULL: "{{ avoc_skip_registry_pull | lower }}"
      register: avoc_deploy_result
      changed_when: true

    - name: Deploy-Ausgabe anzeigen
      ansible.builtin.debug:
        var: avoc_deploy_result.stdout_lines
