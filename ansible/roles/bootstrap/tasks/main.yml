---
# roles/bootstrap/tasks/main.yml
# Idempotente Ablösung von docs/deployment/hetzner-setup.md Schritt 3 (einmaliger,
# nicht-idempotenter Bash-Block, manuell in eine SSH-Session eingefügt). Läuft unverändert sowohl
# gegen die lokale VM (ansible_user=avoc, siehe inventory/hosts.ini) als auch später gegen einen
# frischen echten Hetzner-Server (ansible_user=root, eigenes Inventory) — beide Zweige sind
# idempotent, s. Kommentare unten.

- name: Python3 sicherstellen (Ubuntu-Cloud-Images liefern es nicht immer vorinstalliert)
  ansible.builtin.raw: test -e /usr/bin/python3 || (apt-get update -qq && apt-get install -y -qq python3-minimal)
  changed_when: false

- name: Facts sammeln (erst jetzt möglich — Python3 s. Task oben)
  ansible.builtin.setup:

- name: Paketindex aktualisieren + System-Upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Docker-Vorbedingungen installieren
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: /etc/apt/keyrings anlegen
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker GPG-Key herunterladen
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker Apt-Repository eintragen
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | default('amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ docker_apt_release_codename }} stable
    state: present
    filename: docker

- name: Docker-Pakete installieren
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Docker-Dienst aktivieren + starten
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: "{{ avoc_user }}-Benutzer anlegen"
  ansible.builtin.user:
    name: "{{ avoc_user }}"
    shell: /bin/bash
    create_home: true
    groups: docker
    append: true

- name: "Prüfen ob authorized_keys für {{ avoc_user }} bereits vorhanden ist"
  ansible.builtin.stat:
    path: "{{ app_base_dir }}/.ssh/authorized_keys"
  register: avoc_authorized_keys

- name: "SSH-Verzeichnis für {{ avoc_user }} anlegen"
  ansible.builtin.file:
    path: "{{ app_base_dir }}/.ssh"
    state: directory
    owner: "{{ avoc_user }}"
    group: "{{ avoc_user }}"
    mode: "0700"
  when: not avoc_authorized_keys.stat.exists

# Nur relevant für den Erstbootstrap eines frischen echten Hetzner-Servers (ansible_user=root,
# root hat den Hetzner-Cloud-SSH-Key bereits über /root/.ssh/authorized_keys). Auf der lokalen VM
# existiert dieser Pfad nicht (avoc bekommt den Key bereits direkt über cloud-init, siehe
# scripts/local-vm-create.sh) — 'ignore_errors' macht diesen Task auf der lokalen VM zum
# folgenlosen No-Op statt zum Abbruch.
- name: "authorized_keys von root übernehmen (nur Erstbootstrap eines echten Servers)"
  ansible.builtin.copy:
    src: /root/.ssh/authorized_keys
    dest: "{{ app_base_dir }}/.ssh/authorized_keys"
    owner: "{{ avoc_user }}"
    group: "{{ avoc_user }}"
    mode: "0600"
    remote_src: true
  when: not avoc_authorized_keys.stat.exists
  ignore_errors: true

- name: App-Verzeichnisstruktur anlegen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ avoc_user }}"
    group: "{{ avoc_user }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/mosquitto"
    - "{{ app_dir }}/mediamtx"
    - "{{ app_base_dir }}/loki"
    - "{{ app_base_dir }}/promtail"
    - "{{ app_base_dir }}/grafana/provisioning/datasources"
    - "{{ app_base_dir }}/grafana/provisioning/dashboards"
