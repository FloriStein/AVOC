name: Security Scan

# CIHARD-02 (tasks/backlog.md EPIC "Testabdeckungs-Gesamtaudit 2026-07-21", Teil 5 —
# CI-Härtung, Sprint 55) introduced this as a non-blocking, informational scan
# (continue-on-error: true) since the findings backlog didn't exist yet and needed triage first.
#
# SEC-CI-05 (Sprint 59): both jobs are now required status checks (branch protection on `main`,
# s. README.md "Required Status Checks") — continue-on-error removed. Findings were triaged to
# zero (SEC-CI-01..04): gosec's G104/G114/G304/G404 issues fixed or marked `#nosec` with a
# justification comment where the flagged code is a verified false positive (never blanket-
# suppressed); npm audit vulnerabilities fixed via `npm audit fix` + a scoped `overrides` entry
# for the one transitive dep (esbuild, dev-server-only) that needed a version bump `npm audit
# fix` couldn't apply automatically. Any new finding now fails the PR — regressions must be fixed
# or justified inline, not silently reintroduced.
#
# Fix (2026-07-23): npm's registry retired the legacy "quick audit" endpoint
# (POST /-/npm/v1/security/audits/quick), which `npm audit` falls back to when no `node_modules`
# is present (as was the case here — this job checked out the repo and ran `npm audit` directly,
# unlike every other frontend job which runs `npm ci` first). Added an `npm ci` step so `npm audit`
# resolves against an installed tree and uses the current "bulk advisory" endpoint instead.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gosec:
    name: gosec (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: gosec
        uses: securego/gosec@master
        with:
          args: ./...

  npm-audit:
    name: npm audit (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        run: npm audit
