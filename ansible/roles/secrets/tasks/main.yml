---
# roles/secrets/tasks/main.yml — .env aus fest hinterlegten Test-Dummy-Werten templaten
# (LOCALVM-05), SSL-Selfsigned-Zertifikat analog scripts/secrets-setup-hetzner.sh
# (docs/deployment/hetzner-setup.md Schritt 4).

- name: TURN_EXTERNAL_IP effektiv bestimmen (Inventory-IP der VM)
  ansible.builtin.set_fact:
    avoc_turn_external_ip: "{{ ansible_host | default(ansible_default_ipv4.address | default('127.0.0.1')) }}"

- name: .env aus Test-Dummy-Werten templaten
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ avoc_user }}"
    group: "{{ avoc_user }}"
    mode: "0600"

- name: SSL-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ app_dir }}/ssl"
    state: directory
    owner: "{{ avoc_user }}"
    group: "{{ avoc_user }}"
    mode: "0755"

- name: Prüfen ob Self-Signed-SSL-Zertifikat bereits existiert
  ansible.builtin.stat:
    path: "{{ app_dir }}/ssl/cert.pem"
  register: avoc_ssl_cert

- name: Self-Signed-SSL-Zertifikat generieren (wie secrets-setup-hetzner.sh)
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -newkey rsa:2048
      -keyout {{ app_dir }}/ssl/key.pem
      -out {{ app_dir }}/ssl/cert.pem
      -days 365 -nodes
      -subj "/CN={{ avoc_turn_external_ip }}"
      -addext "subjectAltName=IP:{{ avoc_turn_external_ip }}"
  become_user: "{{ avoc_user }}"
  when: not avoc_ssl_cert.stat.exists
  changed_when: true

- name: Zertifikat-Dateirechte absichern
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ avoc_user }}"
    group: "{{ avoc_user }}"
    mode: "0600"
  loop:
    - "{{ app_dir }}/ssl/key.pem"
    - "{{ app_dir }}/ssl/cert.pem"
