# AVOC — Ansible-Inventory für die lokale Test-VM (Nachbildung des künftigen Hetzner-Servers).
#
# Der Eintrag <VM_IP_PLACEHOLDER> wird von scripts/local-vm-create.sh nach der VM-Erstellung
# automatisch ersetzt (IP per 'virsh domifaddr' ermittelt, siehe dortiger Kommentar). Bis dahin
# ist dies kein gültiges Ziel — Sprint 48 Teil A ist reine Autorierung ohne echten VM-Zugriff,
# siehe tasks/sprints/48-lokale-ansible-vm-teil-a.md. Die tatsächliche VM-Erzeugung + der erste
# echte Ansible-Lauf sind Sprint B (LOCALVM-08).
#
# Für einen echten Hetzner-Server (später, eigenes Vorhaben): eigene Inventory-Datei anlegen
# (z. B. inventory/hetzner.ini) mit ansible_user=root für den allerersten Bootstrap-Lauf — ein
# frischer Hetzner-Server hat noch keinen avoc-User (siehe docs/deployment/hetzner-setup.md
# Schritt 3). Die lokale VM hat den avoc-User dagegen schon ab cloud-init (siehe
# scripts/local-vm-create.sh), daher hier direkt ansible_user=avoc — roles/bootstrap bleibt
# trotzdem idempotent für beide Fälle nutzbar (siehe dortigen Kommentar zu authorized_keys).

[local_vm]
avoc-local-vm ansible_host=<VM_IP_PLACEHOLDER> ansible_user=avoc ansible_ssh_private_key_file=~/.ssh/id_ed25519

[local_vm:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
