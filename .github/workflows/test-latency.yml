name: Test Latency

# ADR-006 (Testing Strategy) documents the Latency Gate (<100ms p99) as "BLOCKING". Sprint 41
# (tasks/backlog.md EPIC "CI-Gates einführen") deliberately deviated from that and kept it
# non-blocking, pending a noise baseline — GitHub-hosted runners have shared-tenancy CPU noise,
# so a hard <100ms assertion could in theory block merges on runner noise, not actual code
# regressions.
#
# Grill-Me decision (DRIFT-K4, Sprint 60, 2026-07-23, tasks/sprints/60-*.md): tightened to
# BLOCKING. Baseline established — 47 recorded runs since Sprint 41, all passed, measured p99 in
# every sampled run 0-1ms (~100x margin below the 100ms budget). The noise-margin concern never
# materialized. `continue-on-error` removed from the go-benchmark job only; the k6 job stays
# non-blocking (separate concern, not part of this decision). Branch-protection required-status-
# check activation is a separate follow-up requiring explicit user sign-off — not done here.
#
# The BenchmarkControlACKRoundtrip session_id/vehicle_id skip-bug noted here until Sprint 60 was
# fixed in Sprint 55 (CIHARD-01, tasks/sprints/55-ci-haertung.md) — the benchmark now runs and
# produces real latency numbers, it does not SKIP.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-benchmark:
    name: Go Benchmark (ACK Roundtrip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: make test-latency
        run: make test-latency

  k6:
    name: k6 Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: make test-k6
        run: make test-k6
