# AVOC — Ansible-Konfiguration für die lokale Test-VM (Hetzner-Nachbildung).
# Sprint 48 (LOCALVM-01), siehe tasks/backlog.md EPIC "Lokale Ansible-VM als
# Hetzner-Nachbildung (AWS-Ersatz für die Testumgebung)".
#
# Aufruf immer aus diesem Verzeichnis (ansible/), z. B.:
#   ansible-playbook site.yml
#   ansible-playbook deploy.yml
#   ansible-playbook site.yml --syntax-check

[defaults]
inventory      = inventory/hosts.ini
roles_path     = roles
retry_files_enabled = False

# Lokale VM: neu erzeugt bei jedem 'local-vm-create.sh'-Lauf -> wechselnder Host-Key ist normal,
# kein Sicherheitsproblem auf einem rein lokalen, nicht routbaren libvirt-Netz. Für einen echten
# Hetzner-Server NICHT verwenden (eigenes Inventory/eigene ansible.cfg dafür anlegen und dort
# host_key_checking nicht global abschalten).
host_key_checking = False

stdout_callback = default
interpreter_python = auto_silent

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False
