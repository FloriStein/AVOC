name: Docker Build Verification

# CIHARD-03 (tasks/backlog.md EPIC "Testabdeckungs-Gesamtaudit 2026-07-21", Teil 5 —
# CI-Härtung, Sprint 55): non-blocking container build check. continue-on-error: true —
# deliberately NOT a merge gate: this only guards against "builds locally, doesn't build in
# CI/Prod" Dockerfile drift (missing files in .dockerignore, stale base images, etc.), it is
# not a functional test — build failures need a look, not an automatic merge block.
# `docker buildx build` runs against each of the 8 targets from
# infrastructure/compose/docker-compose.yml.
#
# CIPUB-01 (tasks/backlog.md EPIC "CI-Image-Publishing nach GHCR", Sprint 56): on a push to
# main, images are additionally pushed to GHCR (ghcr.io/<owner>/avoc-<service>:latest +
# :<git-sha>). On pull_request, push stays false — no images from unverified PR branches.
#
# GHCRPULL-02 (tasks/backlog.md EPIC "GHCR-Pull-Deployment", Sprint 57): on a push of a `v*`
# tag, an additional version tag (ghcr.io/<owner>/avoc-<service>:<git-tag>) is pushed, so VM
# deployments can pin to a real release instead of floating `:latest`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  go-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - control-server
          - auth-service
          - safety-service
          - telemetry-service
          - webrtc-sfu
          - fleet-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR requires lowercase image refs; github.repository_owner can be mixed-case
      # (e.g. "FloriStein") and Actions expressions have no toLower() function.
      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCRPULL-02: on a `v*` tag push, publish only the version tag (not :latest — :latest
      # tracks main, a tag push may not be built from main's current HEAD).
      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${OWNER_LC}/avoc-${SERVICE}"
          {
            echo "tags<<TAGSEOF"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "$IMG:${{ github.ref_name }}"
            else
              echo "$IMG:latest"
              echo "$IMG:${{ github.sha }}"
            fi
            echo "TAGSEOF"
          } >> "$GITHUB_OUTPUT"
        env:
          SERVICE: ${{ matrix.service }}

      - name: docker buildx build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/go-service.Dockerfile
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
          tags: ${{ steps.tags.outputs.tags }}

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${OWNER_LC}/avoc-frontend"
          {
            echo "tags<<TAGSEOF"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "$IMG:${{ github.ref_name }}"
            else
              echo "$IMG:latest"
              echo "$IMG:${{ github.sha }}"
            fi
            echo "TAGSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: docker buildx build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend.Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
          tags: ${{ steps.tags.outputs.tags }}

  vehicle-mock:
    name: Build vehicle-mock
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${OWNER_LC}/avoc-vehicle-mock"
          {
            echo "tags<<TAGSEOF"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "$IMG:${{ github.ref_name }}"
            else
              echo "$IMG:latest"
              echo "$IMG:${{ github.sha }}"
            fi
            echo "TAGSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: docker buildx build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/vehicle-mock.Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
          tags: ${{ steps.tags.outputs.tags }}
