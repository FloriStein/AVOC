---
# roles/secrets/defaults — FEST HINTERLEGTE TEST-DUMMY-WERTE für die lokale VM (LOCALVM-05).
#
# KEINE echten/zufälligen Produktions-Secrets — analog zum bestehenden Muster committeter
# Test-Credentials in diesem Projekt (z. B. tests/mosquitto-passwd-test). Nur für ein rein
# lokales, nicht internet-exponiertes System gedacht (Architektur-Entscheidung, siehe
# tasks/backlog.md EPIC "Lokale Ansible-VM als Hetzner-Nachbildung"). Das echte, interaktive
# scripts/secrets-setup-hetzner.sh bleibt für den späteren echten Hetzner-Server unverändert
# nutzbar — diese Rolle ersetzt es NUR für die lokale VM.
#
# Mindestlängen bewusst an secrets-setup-hetzner.sh angelehnt (JWT_SECRET >=32, DB_PASSWORD >=16,
# ADMIN_PASSWORD >=12, WHIP_STREAM_KEY >=32, TURN_PASSWORD >=16, GRAFANA_ADMIN_PASSWORD >=12),
# damit dieselben Werte auch für einen manuellen Vergleichslauf des interaktiven Skripts taugen.

# GHCRPULL-04 (tasks/backlog.md EPIC "GHCR-Pull-Deployment", Sprint 57): Default-Registry ist
# jetzt ghcr.io (owner lowercase, s. .github/workflows/docker-build.yml OWNER_LC-Schritt) statt
# der alten "local-vm-no-registry"-Dummy-Konstante — die VM pullt per Default von dort (s.
# ansible/deploy.yml avoc_skip_registry_pull). Override per Umgebungsvariable möglich:
#   GHCR_REGISTRY=ghcr.io/anderer-owner ansible-playbook ...
avoc_secrets_registry: "{{ lookup('env', 'GHCR_REGISTRY') | default('ghcr.io/floristein', true) }}"
avoc_secrets_version: "latest"

avoc_secrets_jwt_secret: "local-test-dummy-jwt-secret-not-for-prod-use"
avoc_secrets_db_password: "local-test-dummy-db-password"
avoc_secrets_admin_password: "local-test-admin-pw"
avoc_secrets_whip_stream_key: "local-test-dummy-whip-stream-key-value-32chars"

avoc_secrets_turn_realm: "avoc.local-vm.test"
avoc_secrets_turn_user: "avoc"
avoc_secrets_turn_password: "local-test-turn-password"

avoc_secrets_grafana_admin_user: "admin"
avoc_secrets_grafana_admin_password: "local-test-grafana-pw"

# GHCRPULL-01/04 (Sprint 57): echter GHCR-Login (Classic PAT, nur `read:packages`-Scope — s.
# tasks/current-sprint.md GHCRPULL-01, Fine-grained-PATs funktionieren nachweislich nicht
# zuverlässig mit ghcr.io-Login). Zugangsdaten werden NIE committet, sondern zur Laufzeit per
# Umgebungsvariable injiziert (analog VERSION in ansible/deploy.yml):
#   GHCR_USERNAME=<github-user> GHCR_TOKEN=<PAT> ansible-playbook -i ansible/inventory/hosts.ini deploy.yml
# Ohne gesetzte Variablen bleiben die alten Dummy-Werte aktiv — die funktionieren NUR mit dem
# Fallback (avoc_skip_registry_pull=true, s. ansible/deploy.yml), ein echter GHCR-Pull mit
# Dummy-Werten schlägt beim Login bewusst fehl statt still falsche Images zu laden.
avoc_secrets_docker_username: "{{ lookup('env', 'GHCR_USERNAME') | default('local-vm-unused', true) }}"
avoc_secrets_docker_password: "{{ lookup('env', 'GHCR_TOKEN') | default('local-vm-unused', true) }}"

# Für MQTT-Client-Credentials (control-server/telemetry-service/fleet-service/vehicle-mock) —
# nicht Teil von secrets-setup-hetzner.sh (das Skript ist älter als MQTTAUTH-04), aber vom
# Compose-Stand (docker-compose.prod.yml) benötigt.
#
# HINWEIS (Sprint 49, LOCALVM-08b, Erkenntnis aus dem ersten echten deploy.yml-Lauf): Das
# Passwort MUSS zum Klartext-Passwort passen, mit dem infrastructure/mosquitto/passwd gehasht
# wurde (ansible/deploy.yml kopiert diese Datei unverändert auf die VM, generiert sie NICHT neu
# wie scripts/deploy.sh das für EC2 tut — s. Kommentar dort). Der ursprüngliche Wert
# "local-test-mqtt-password" passte nicht zum committeten Hash und führte zu einem realen,
# beim echten Lauf sichtbaren Fehlschlag ("not Authorized", telemetry-service/fleet-service/
# vehicle-mock verbanden sich nie zum Broker). Laut tasks/sprints/38-mqtt-authentifizierung.md
# "Ergebnisse" (MQTTAUTH-01) ist infrastructure/mosquitto/passwd mit avoc/changeme gehasht — Fix:
# Wert hier exakt darauf ausgerichtet.
avoc_secrets_mqtt_username: "avoc"
avoc_secrets_mqtt_password: "changeme"
