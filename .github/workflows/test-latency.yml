name: Test Latency

# ADR-006 (Testing Strategy) documents the Latency Gate (<100ms p99) as "BLOCKING". Sprint 41
# (tasks/backlog.md EPIC "CI-Gates einführen") deliberately deviates from that and keeps it
# non-blocking here — analogous to lint.yml's non-blocking rationale and ADR-006's own
# WebRTC-Non-Determinism-Policy: GitHub-hosted runners have shared-tenancy CPU noise, so a hard
# <100ms assertion would block merges on runner noise, not on actual code regressions. Results
# stay visible (job log / benchmark output), but continue-on-error: true means neither job can
# fail a required check. Tightening to blocking is a possible follow-up once enough CI runs
# establish a noise baseline.
#
# Known gap (found while wiring this job, 2026-07-19, not fixed here — out of scope for
# "introduce CI gates"): BenchmarkControlACKRoundtrip (tests/performance/latency_test.go) dials
# the /ws endpoint before calling startSession() and never passes the session_id query parameter
# ADR-025 introduced — the server now rejects the handshake with "session_id required" and the
# benchmark SKIPs every run (verified locally, 2x). The k6 job below is unaffected (hits
# /sessions with just a bearer token) and does produce real latency numbers. Tracked as a backlog
# follow-up rather than fixed here since it changes test behavior, not CI wiring.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-benchmark:
    name: Go Benchmark (ACK Roundtrip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: make test-latency
        run: make test-latency

  k6:
    name: k6 Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: make test-k6
        run: make test-k6
